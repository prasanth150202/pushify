# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "76a0889c1a8ffc064c4cf865e40fdd92"
name = "Push Notification"
application_url = "https://19644ae838e1.ngrok-free.app/"
embedded = true
handle = "push-notify-3"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_app_proxy,write_app_proxy,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://19644ae838e1.ngrok-free.app/auth/callback",
  "https://19644ae838e1.ngrok-free.app/auth/shopify/callback",
  "https://19644ae838e1.ngrok-free.app/api/auth/callback"
]

[app_proxy]
url = "https://api.zingbot.io/push-notify"
subpath = "notify"
prefix = "apps"

[pos]
embedded = false
  